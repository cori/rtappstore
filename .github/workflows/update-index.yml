name: Update App Index

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/update-index.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regeneration even if no app dir changes'
        type: boolean
        default: false
        required: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Detect app directory changes
        id: changes
        run: |
          # Get list of app directories currently in main
          git ls-tree -d --name-only HEAD apps/ | sort > /tmp/current_apps.txt
          
          # Get list of app directories before this push
          git ls-tree -d --name-only HEAD~1 apps/ 2>/dev/null | sort > /tmp/previous_apps.txt || touch /tmp/previous_apps.txt
          
          # Find added/removed directories
          comm -13 /tmp/previous_apps.txt /tmp/current_apps.txt > /tmp/added.txt || true
          comm -23 /tmp/previous_apps.txt /tmp/current_apps.txt > /tmp/removed.txt || true
          
          ADDED=$(cat /tmp/added.txt | wc -l)
          REMOVED=$(cat /tmp/removed.txt | wc -l)
          
          echo "added=$(cat /tmp/added.txt | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT
          echo "removed=$(cat /tmp/removed.txt | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT
          echo "changed=$(( ADDED + REMOVED ))" >> $GITHUB_OUTPUT

      - name: Generate INDEX.md
        if: steps.changes.outputs.changed != '0' || github.event.inputs.force == 'true'
        run: |
          INDEX_FILE="apps/INDEX.md"
          {
            echo "# App Index"
            echo ""
            echo "Auto-generated on $(date -u +"%Y-%m-%d %H:%M UTC") — do not edit manually."
            echo ""
            echo "| App | Name | Version | Author | Categories | Port | Source Code | Container Image | Description |"
            echo "|-----|------|---------|--------|------------|------|-------------|-----------------|-------------|"
            
            for dir in apps/*/; do
              app_id=$(basename "$dir")
              [[ "$app_id" == "INDEX.md" ]] && continue
              
              cfg="$dir/config.json"
              [[ -f "$cfg" ]] || continue
              
              name=$(jq -r '.name' "$cfg")
              version=$(jq -r '.version' "$cfg")
              author=$(jq -r '.author' "$cfg")
              port=$(jq -r '.port' "$cfg")
              short_desc=$(jq -r '.short_desc' "$cfg")
              categories=$(jq -r '.categories | join(", ")' "$cfg")
              source=$(jq -r '.source' "$cfg")
              website=$(jq -r '.website // .source' "$cfg")
              
              # Get container image from docker-compose.json
              compose="$dir/docker-compose.json"
              image=""
              [[ -f "$compose" ]] && image=$(jq -r '.services[0].image // ""' "$compose" 2>/dev/null)
              
              # Build source code link
              if [[ "$source" == "$website" ]]; then
                source_link="[$source]($source)"
              else
                source_link="[code]($source) · [website]($website)"
              fi
              
              # Build container image link (extract registry + repo from image)
              image_link=""
              if [[ -n "$image" && "$image" != "null" ]]; then
                # Parse registry/repo from image (e.g., ghcr.io/user/repo:tag -> ghcr.io/user/repo)
                registry_repo=$(echo "$image" | sed 's|:.*$||')
                if [[ "$registry_repo" == ghcr.io/* ]]; then
                  image_link="[ghcr.io]($registry_repo)"
                elif [[ "$registry_repo" == docker.io/* ]]; then
                  image_link="[docker.io]($registry_repo)"
                elif [[ "$registry_repo" == *"/"* ]]; then
                  image_link="[$registry_repo](https://$registry_repo)"
                else
                  image_link="[$registry_repo](https://hub.docker.com/r/$registry_repo)"
                fi
              fi
              
              # GitHub URL for the app directory in this repo
              dir_url="https://github.com/cori/rtappstore/tree/main/apps/$app_id"
              
              printf "| [%s](%s) | %s | %s | %s | %s | %s | %s | %s | %s |\n" \
                "$app_id" "$dir_url" "$name" "$version" "$author" "$categories" "$port" "$source_link" "$image_link" "$short_desc"
            done
            
            echo ""
            echo "---"
            echo ""
            echo "## Legend"
            echo "- **App**: Directory name (link to app config in this repo)"
            echo "- **Source Code**: Link to upstream source repository"
            echo "- **Container Image**: Link to container registry (GHCR, Docker Hub, etc.)"
            echo "- **Version**: Docker image version (matches config.json)"
          } > "$INDEX_FILE"

      - name: Commit INDEX.md
        if: steps.changes.outputs.changed != '0' || github.event.inputs.force == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/INDEX.md
          git commit -m "chore: update app index (added: ${{ steps.changes.outputs.added }}, removed: ${{ steps.changes.outputs.removed }})"
          git push